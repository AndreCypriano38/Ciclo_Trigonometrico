<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Círculo Trigonométrico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:       #0f0f0e;
      --bg2:      #1a1a18;
      --bg3:      #232320;
      --border:   rgba(255,255,255,0.10);
      --text:     #e8e6df;
      --text2:    #8a887e;
      --text3:    #555450;
      --accent:   #d4a523;

      --sin: #E8593C;
      --cos: #3B8BD4;
      --tan: #D4A523;
      --cot: #9B6FE8;
      --sec: #2EC48A;
      --csc: #E85380;

      --r: 16px;
      --r-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100dvh;
      overscroll-behavior: none;
    }

    /* ── HEADER ── */
    header {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text);
    }
    header span {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── MAIN LAYOUT ── */
    main {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── ANGLE DISPLAY BAR ── */
    .angle-bar {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--border);
    }
    .angle-cell {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      gap: 3px;
    }
    .angle-cell + .angle-cell {
      border-left: 1px solid var(--border);
    }
    .angle-cell .lbl {
      font-size: 10px;
      font-weight: 500;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .angle-cell .val {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    /* ── CANVAS SECTION ── */
    .canvas-section {
      position: relative;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    canvas {
      display: block;
      width: 100%;
      touch-action: none;
    }

    /* Zoom overlay buttons */
    .zoom-overlay {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .zoom-btn {
      width: 40px; height: 40px;
      background: rgba(26,26,24,0.88);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 22px;
      font-weight: 300;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background .15s;
      user-select: none;
    }
    .zoom-btn:active { background: var(--bg3); }

    .zoom-label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: var(--text3);
      background: rgba(26,26,24,0.75);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      letter-spacing: 0.05em;
    }

    /* ── SLIDER ── */
    .slider-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .slider-section label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }
    input[type=range] {
      flex: 1;
      height: 36px;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 3px;
      background: var(--bg3);
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px;
      margin-top: -9.5px;
      background: var(--accent);
      border-radius: 50%;
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .slider-val {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--text2);
      min-width: 36px;
      text-align: right;
    }

    /* ── NOTABLE ANGLES ── */
    .notable-section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notable-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .quad-lbl {
      font-family: 'DM Serif Display', serif;
      font-size: 14px;
      color: var(--text3);
      width: 22px;
      text-align: center;
      flex-shrink: 0;
      font-style: italic;
    }
    .a-btn {
      flex: 1;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 9px 4px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text2);
      cursor: pointer;
      text-align: center;
      transition: all .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .a-btn:active { background: var(--bg2); }
    .a-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    /* ── RATIOS GRID ── */
    .ratios-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }
    .ratios-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .ratio-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg3);
      border-radius: var(--r-sm);
      border-left: 3px solid transparent;
      transition: opacity .2s;
    }
    .ratio-card.dimmed { opacity: 0.22; }
    .ratio-name {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      min-width: 32px;
    }
    .ratio-val {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--text);
      margin-left: auto;
      text-align: right;
    }
    .ratio-undef {
      font-size: 10px;
      color: var(--text3);
      font-style: italic;
    }

    /* ── LEGEND ── */
    .legend-section {
      padding: 14px 16px 20px;
    }
    .legend-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .clear-btn {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      padding: 5px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text3);
      cursor: pointer;
      transition: all .15s;
    }
    .clear-btn:active { background: var(--bg3); color: var(--text); }

    .legend-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 12px;
      background: var(--bg3);
      border-radius: var(--r-sm);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all .18s;
      user-select: none;
    }
    .legend-item:active { filter: brightness(1.15); }
    .legend-item.active {
      background: var(--bg2);
      border-color: var(--item-color);
    }
    .legend-item.inactive { opacity: 0.30; }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
    }
    .legend-check {
      font-size: 12px;
      color: var(--item-color);
      opacity: 0;
      transition: opacity .15s;
    }
    .legend-item.active .legend-check { opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1>Círculo Trigonométrico</h1>
  <span>interativo</span>
</header>

<main>

  <!-- ANGLE DISPLAY -->
  <div class="angle-bar">
    <div class="angle-cell">
      <span class="lbl">Graus</span>
      <span class="val" id="disp-deg">45°</span>
    </div>
    <div class="angle-cell">
      <span class="lbl">Radianos</span>
      <span class="val" id="disp-rad">π/4</span>
    </div>
  </div>

  <!-- CANVAS -->
  <div class="canvas-section">
    <canvas id="circ"></canvas>
    <div class="zoom-overlay">
      <button class="zoom-btn" id="zoom-in" aria-label="Zoom in">+</button>
      <button class="zoom-btn" id="zoom-out" aria-label="Zoom out">−</button>
    </div>
    <div class="zoom-label" id="zoom-label">zoom 1.00×</div>
  </div>

  <!-- SLIDER -->
  <div class="slider-section">
    <label>Arco</label>
    <input type="range" id="arc-slider" min="0" max="360" step="1" value="45">
    <span class="slider-val" id="slider-deg">45°</span>
  </div>

  <!-- NOTABLE ANGLES -->
  <div class="notable-section">
    <div class="notable-row">
      <span class="quad-lbl">I</span>
      <button class="a-btn" data-angle="30">30°</button>
      <button class="a-btn" data-angle="45">45°</button>
      <button class="a-btn" data-angle="60">60°</button>
    </div>
    <div class="notable-row">
      <span class="quad-lbl">II</span>
      <button class="a-btn" data-angle="150">150°</button>
      <button class="a-btn" data-angle="135">135°</button>
      <button class="a-btn" data-angle="120">120°</button>
    </div>
    <div class="notable-row">
      <span class="quad-lbl">III</span>
      <button class="a-btn" data-angle="210">210°</button>
      <button class="a-btn" data-angle="225">225°</button>
      <button class="a-btn" data-angle="240">240°</button>
    </div>
    <div class="notable-row">
      <span class="quad-lbl">IV</span>
      <button class="a-btn" data-angle="330">330°</button>
      <button class="a-btn" data-angle="315">315°</button>
      <button class="a-btn" data-angle="300">300°</button>
    </div>
  </div>

  <!-- RATIO CARDS -->
  <div class="ratios-section">
    <div class="section-title">Razões Trigonométricas</div>
    <div class="ratios-grid">
      <div class="ratio-card" id="card-sin" style="border-left-color:var(--sin)">
        <span class="ratio-name" style="color:var(--sin)">sen</span>
        <span class="ratio-val" id="r-sin">–</span>
      </div>
      <div class="ratio-card" id="card-cos" style="border-left-color:var(--cos)">
        <span class="ratio-name" style="color:var(--cos)">cos</span>
        <span class="ratio-val" id="r-cos">–</span>
      </div>
      <div class="ratio-card" id="card-tan" style="border-left-color:var(--tan)">
        <span class="ratio-name" style="color:var(--tan)">tg</span>
        <span class="ratio-val" id="r-tan">–</span>
      </div>
      <div class="ratio-card" id="card-cot" style="border-left-color:var(--cot)">
        <span class="ratio-name" style="color:var(--cot)">cotg</span>
        <span class="ratio-val" id="r-cot">–</span>
      </div>
      <div class="ratio-card" id="card-sec" style="border-left-color:var(--sec)">
        <span class="ratio-name" style="color:var(--sec)">sec</span>
        <span class="ratio-val" id="r-sec">–</span>
      </div>
      <div class="ratio-card" id="card-csc" style="border-left-color:var(--csc)">
        <span class="ratio-name" style="color:var(--csc)">csc</span>
        <span class="ratio-val" id="r-csc">–</span>
      </div>
    </div>
  </div>

  <!-- LEGEND -->
  <div class="legend-section">
    <div class="legend-header">
      <span class="section-title" style="margin:0">Legenda</span>
      <button class="clear-btn" id="clear-btn">apagar todas</button>
    </div>
    <div class="legend-grid">
      <div class="legend-item active" data-ratio="sin" style="--item-color:var(--sin)">
        <span class="legend-dot" style="background:var(--sin)"></span>
        <span class="legend-name">seno</span>
        <span class="legend-check">✓</span>
      </div>
      <div class="legend-item active" data-ratio="cos" style="--item-color:var(--cos)">
        <span class="legend-dot" style="background:var(--cos)"></span>
        <span class="legend-name">cosseno</span>
        <span class="legend-check">✓</span>
      </div>
      <div class="legend-item active" data-ratio="tan" style="--item-color:var(--tan)">
        <span class="legend-dot" style="background:var(--tan)"></span>
        <span class="legend-name">tangente</span>
        <span class="legend-check">✓</span>
      </div>
      <div class="legend-item active" data-ratio="cot" style="--item-color:var(--cot)">
        <span class="legend-dot" style="background:var(--cot)"></span>
        <span class="legend-name">cotangente</span>
        <span class="legend-check">✓</span>
      </div>
      <div class="legend-item active" data-ratio="sec" style="--item-color:var(--sec)">
        <span class="legend-dot" style="background:var(--sec)"></span>
        <span class="legend-name">secante</span>
        <span class="legend-check">✓</span>
      </div>
      <div class="legend-item active" data-ratio="csc" style="--item-color:var(--csc)">
        <span class="legend-dot" style="background:var(--csc)"></span>
        <span class="legend-name">cossecante</span>
        <span class="legend-check">✓</span>
      </div>
    </div>
  </div>

</main>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let currentDeg = 45;
let zoomScale  = 1.0;
const ZOOM_MIN = 0.18, ZOOM_MAX = 2.2, ZOOM_STEP = 0.12;

const visible = { sin:true, cos:true, tan:true, cot:true, sec:true, csc:true };

// ─── COLORS ──────────────────────────────────────────────────────────────────
const C = {
  sin:'#E8593C', cos:'#3B8BD4', tan:'#D4A523',
  cot:'#9B6FE8', sec:'#2EC48A', csc:'#E85380',
};

// ─── EXACT VALUES ─────────────────────────────────────────────────────────────
const EXACT = {
  0:  {sin:'0',    cos:'1',     tan:'0',     cot:'∞',    sec:'1',      csc:'∞'},
  30: {sin:'1/2',  cos:'√3/2',  tan:'√3/3',  cot:'√3',   sec:'2√3/3',  csc:'2'},
  45: {sin:'√2/2', cos:'√2/2',  tan:'1',     cot:'1',    sec:'√2',     csc:'√2'},
  60: {sin:'√3/2', cos:'1/2',   tan:'√3',    cot:'√3/3', sec:'2',      csc:'2√3/3'},
  90: {sin:'1',    cos:'0',     tan:'∞',     cot:'0',    sec:'∞',      csc:'1'},
  120:{sin:'√3/2', cos:'-1/2',  tan:'-√3',   cot:'-√3/3',sec:'-2',     csc:'2√3/3'},
  135:{sin:'√2/2', cos:'-√2/2', tan:'-1',    cot:'-1',   sec:'-√2',    csc:'√2'},
  150:{sin:'1/2',  cos:'-√3/2', tan:'-√3/3', cot:'-√3',  sec:'-2√3/3', csc:'2'},
  180:{sin:'0',    cos:'-1',    tan:'0',     cot:'∞',    sec:'-1',     csc:'∞'},
  210:{sin:'-1/2', cos:'-√3/2', tan:'√3/3',  cot:'√3',   sec:'-2√3/3', csc:'-2'},
  225:{sin:'-√2/2',cos:'-√2/2', tan:'1',     cot:'1',    sec:'-√2',    csc:'-√2'},
  240:{sin:'-√3/2',cos:'-1/2',  tan:'√3',    cot:'√3/3', sec:'-2',     csc:'-2√3/3'},
  270:{sin:'-1',   cos:'0',     tan:'∞',     cot:'0',    sec:'∞',      csc:'-1'},
  300:{sin:'-√3/2',cos:'1/2',   tan:'-√3',   cot:'-√3/3',sec:'2',      csc:'-2√3/3'},
  315:{sin:'-√2/2',cos:'√2/2',  tan:'-1',    cot:'-1',   sec:'√2',     csc:'-√2'},
  330:{sin:'-1/2', cos:'√3/2',  tan:'-√3/3', cot:'-√3',  sec:'2√3/3',  csc:'-2'},
  360:{sin:'0',    cos:'1',     tan:'0',     cot:'∞',    sec:'1',      csc:'∞'},
};

const RAD_LABELS = {
  0:'0', 30:'π/6', 45:'π/4', 60:'π/3', 90:'π/2',
  120:'2π/3', 135:'3π/4', 150:'5π/6', 180:'π',
  210:'7π/6', 225:'5π/4', 240:'4π/3', 270:'3π/2',
  300:'5π/3', 315:'7π/4', 330:'11π/6', 360:'2π',
};

// ─── CANVAS SETUP ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('circ');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  const W = canvas.parentElement.clientWidth;
  canvas.width  = W * devicePixelRatio;
  canvas.height = W * devicePixelRatio;
  canvas.style.width  = W + 'px';
  canvas.style.height = W + 'px';
  draw(currentDeg);
}

// ─── DRAW HELPERS ─────────────────────────────────────────────────────────────
function al(key) { return visible[key] ? 1 : 0.06; }

function dline(x1,y1,x2,y2,col,w,dash,a) {
  if (a < 0.02) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.setLineDash(dash||[]); ctx.stroke();
  ctx.restore();
}

function ddot(x,y,col,r,a) {
  if (a < 0.02) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle = col; ctx.fill();
  ctx.restore();
}

function fmt(v) {
  if (!isFinite(v)) return '∞';
  const r = parseFloat(v.toFixed(3));
  return r === 0 ? '0' : String(r);
}

// ─── MAIN DRAW ────────────────────────────────────────────────────────────────
function draw(deg) {
  const W  = canvas.width;
  const cx = W/2, cy = W/2;
  const dpr = devicePixelRatio;

  const R_base = W * 0.33;
  const R = R_base * zoomScale;
  const rad  = deg * Math.PI / 180;
  const cosV = Math.cos(rad), sinV = Math.sin(rad);
  const px = cx + R*cosV, py = cy - R*sinV;
  const EPS = 0.012;

  // BG
  ctx.clearRect(0,0,W,W);
  ctx.fillStyle = '#0f0f0e';
  ctx.fillRect(0,0,W,W);

  // Grid rings
  ctx.setLineDash([4*dpr, 7*dpr]); ctx.lineWidth = 0.7*dpr; ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  for (let i=1; i<=4; i++) { ctx.beginPath(); ctx.arc(cx,cy,R/4*i,0,Math.PI*2); ctx.stroke(); }
  ctx.setLineDash([]);

  // Quadrant labels
  const ql = R*0.62;
  if (ql > 18*dpr) {
    ctx.font = `300 ${Math.min(R*0.13, 20*dpr)}px 'DM Serif Display', serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    [[cx+ql,cy-ql,'I'],[cx-ql,cy-ql,'II'],[cx-ql,cy+ql,'III'],[cx+ql,cy+ql,'IV']].forEach(([x,y,l])=>{
      ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillText(l,x,y);
    });
  }

  // Axes
  const ext = Math.max(W*0.51, R*1.28);
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = dpr;
  ctx.beginPath(); ctx.moveTo(cx-ext,cy); ctx.lineTo(cx+ext,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy+ext); ctx.lineTo(cx,cy-ext); ctx.stroke();

  // Arrowheads
  const aw=7*dpr, ah=4*dpr;
  const arr=(x,y,d)=>{
    ctx.beginPath();
    if(d==='r'){ctx.moveTo(x,y);ctx.lineTo(x-aw,y-ah);ctx.lineTo(x-aw,y+ah);}
    else{ctx.moveTo(x,y);ctx.lineTo(x-ah,y+aw);ctx.lineTo(x+ah,y+aw);}
    ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fill();
  };
  arr(cx+ext,cy,'r'); arr(cx,cy-ext,'u');

  // Axis x/y labels
  ctx.font=`400 ${11*dpr}px 'DM Sans', sans-serif`; ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillText('x',cx+ext-8*dpr,cy-5*dpr);
  ctx.textAlign='right'; ctx.textBaseline='top'; ctx.fillText('y',cx-5*dpr,cy-ext+8*dpr);

  // Ticks ±1
  ctx.lineWidth=dpr; ctx.strokeStyle='rgba(255,255,255,0.20)';
  const tk=5*dpr;
  [[cx+R,cy,'h'],[cx-R,cy,'h'],[cx,cy-R,'v'],[cx,cy+R,'v']].forEach(([x,y,d])=>{
    if(x<0||x>W||y<0||y>W) return;
    ctx.beginPath();
    if(d==='h'){ctx.moveTo(x,y-tk);ctx.lineTo(x,y+tk);}
    else{ctx.moveTo(x-tk,y);ctx.lineTo(x+tk,y);}
    ctx.stroke();
  });
  if (R > 30*dpr) {
    ctx.font=`400 ${9*dpr}px 'Space Mono', monospace`; ctx.fillStyle='rgba(255,255,255,0.25)';
    if(cx+R<W){ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('1',cx+R,cy+6*dpr);}
    if(cx-R>0){ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('-1',cx-R,cy+6*dpr);}
    if(cy-R>0){ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText('1',cx-7*dpr,cy-R);}
    if(cy+R<W){ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText('-1',cx-7*dpr,cy+R);}
  }

  // Main circle
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.20)'; ctx.lineWidth=1.5*dpr; ctx.stroke();

  // Arc indicator
  const arcR = Math.min(R*0.22, 36*dpr);
  ctx.beginPath(); ctx.arc(cx,cy,arcR,0,-rad,rad<0);
  ctx.strokeStyle=C.tan; ctx.lineWidth=2*dpr; ctx.stroke();

  // ── TRIG ──
  const asin=al('sin'),acos=al('cos'),atan=al('tan'),acot=al('cot'),asec=al('sec'),acsc=al('csc');
  const lw = 2.5*dpr, lw2 = 2*dpr;

  // COSSENO (horizontal from origin)
  dline(cx,cy, cx+R*cosV,cy, C.cos,lw,[],acos);
  ddot(cx+R*cosV,cy, C.cos,4*dpr,acos);

  // SENO (vertical from origin)
  dline(cx,cy, cx,cy-R*sinV, C.sin,lw,[],asin);
  ddot(cx,cy-R*sinV, C.sin,4*dpr,asin);

  // Helper dashed projections
  dline(px,py, px,cy, C.cos,dpr,[3*dpr,5*dpr],acos*0.45);
  dline(px,py, cx,py, C.sin,dpr,[3*dpr,5*dpr],asin*0.45);

  // TANGENTE (seg on x=R, i.e. cx+R)
  if (Math.abs(cosV)>EPS) {
    const tanV=sinV/cosV;
    const tanY=cy-R*tanV;
    // subtle sec-axis guide
    dline(cx+R,cy-ext,cx+R,cy+ext, C.tan,0.5*dpr,[5*dpr,8*dpr],Math.max(atan,0.10));
    dline(cx+R,cy,cx+R,tanY, C.tan,lw,[],atan);
    ddot(cx+R,tanY, C.tan,4*dpr,atan);
    dline(cx,cy,cx+R,tanY, C.tan,dpr,[4*dpr,5*dpr],atan*0.45);
  }

  // COTANGENTE (seg on y=R, i.e. cy-R)
  if (Math.abs(sinV)>EPS) {
    const cotV=cosV/sinV;
    const cotX=cx+R*cotV;
    dline(cx-ext,cy-R,cx+ext,cy-R, C.cot,0.5*dpr,[5*dpr,8*dpr],Math.max(acot,0.10));
    dline(cx,cy-R,cotX,cy-R, C.cot,lw,[],acot);
    ddot(cotX,cy-R, C.cot,4*dpr,acot);
    dline(cx,cy,cotX,cy-R, C.cot,dpr,[4*dpr,5*dpr],acot*0.45);
  }

  // SECANTE (from origin to tan point on sec axis)
  if (Math.abs(cosV)>EPS) {
    const tanV=sinV/cosV;
    const tanY=cy-R*tanV;
    dline(cx,cy,cx+R,tanY, C.sec,lw2,[5*dpr,4*dpr],asec);
    ddot(cx+R,tanY, C.sec,5*dpr,asec);
  }

  // COSSECANTE (from origin to cot point on csc axis)
  if (Math.abs(sinV)>EPS) {
    const cotV=cosV/sinV;
    const cotX=cx+R*cotV;
    dline(cx,cy,cotX,cy-R, C.csc,lw2,[5*dpr,4*dpr],acsc);
    ddot(cotX,cy-R, C.csc,5*dpr,acsc);
  }

  // Radius
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,py);
  ctx.strokeStyle='#e8e6df'; ctx.lineWidth=2*dpr; ctx.setLineDash([]); ctx.stroke();

  // Point P
  ctx.beginPath(); ctx.arc(px,py,6*dpr,0,Math.PI*2);
  ctx.fillStyle='#e8e6df'; ctx.fill();
  ctx.strokeStyle='#0f0f0e'; ctx.lineWidth=2*dpr; ctx.stroke();

  // P label (only if R big enough)
  if (R > 60*dpr) {
    ctx.font=`500 ${9*dpr}px 'Space Mono', monospace`;
    ctx.fillStyle='rgba(232,230,223,0.75)';
    ctx.textAlign=cosV>=0?'left':'right';
    ctx.textBaseline=sinV>=0?'bottom':'top';
    const lx=px+(cosV>=0?10*dpr:-10*dpr), ly=py+(sinV>=0?-10*dpr:10*dpr);
    ctx.fillText(`(${fmt(cosV)}, ${fmt(sinV)})`,lx,ly);
  }

  // Notable angle labels
  const notables=[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330];
  const labelR = R + Math.max(13*dpr, R*0.15);
  ctx.font=`400 ${Math.min(9*dpr,13)}px 'Space Mono', monospace`;
  notables.forEach(a=>{
    const ar=a*Math.PI/180;
    const lx=cx+labelR*Math.cos(ar), ly=cy-labelR*Math.sin(ar);
    if(lx<-5||lx>W+5||ly<-5||ly>W+5) return;
    const isActive=Math.abs(a-deg)<0.5;
    ctx.fillStyle=isActive?'#e8e6df':'#555450';
    ctx.globalAlpha=isActive?1:0.9;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(a+'°',lx,ly);
    ctx.globalAlpha=1;
  });

  // Origin dot
  ctx.beginPath(); ctx.arc(cx,cy,3*dpr,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fill();
}

// ─── UPDATE ───────────────────────────────────────────────────────────────────
function toRad(deg) {
  return RAD_LABELS[Math.round(deg)] || (deg*Math.PI/180).toFixed(4)+' rad';
}

function updateCards(deg) {
  const rad=deg*Math.PI/180;
  const s=Math.sin(rad), c=Math.cos(rad);
  const EPS=0.005;
  const ex=EXACT[Math.round(deg)];
  const anyOn=Object.values(visible).some(v=>v);

  const set=(id,key,num,exV)=>{
    const el=document.getElementById(id);
    if(ex&&exV!==undefined){
      el.innerHTML=exV==='∞'?'<span class="ratio-undef">indef.</span>':exV;
    } else {
      el.innerHTML=(!isFinite(num)||Math.abs(num)>999)
        ?'<span class="ratio-undef">indef.</span>'
        :num.toFixed(4);
    }
    const card=document.getElementById('card-'+key);
    card.classList.toggle('dimmed', anyOn && !visible[key]);
  };

  set('r-sin','sin',s,ex?.sin);
  set('r-cos','cos',c,ex?.cos);
  set('r-tan','tan',Math.abs(c)<EPS?Infinity:s/c, ex?.tan);
  set('r-cot','cot',Math.abs(s)<EPS?Infinity:c/s, ex?.cot);
  set('r-sec','sec',Math.abs(c)<EPS?Infinity:1/c, ex?.sec);
  set('r-csc','csc',Math.abs(s)<EPS?Infinity:1/s, ex?.csc);
}

function updateLegend() {
  const anyOn=Object.values(visible).some(v=>v);
  document.querySelectorAll('.legend-item').forEach(el=>{
    const k=el.dataset.ratio;
    el.classList.toggle('active',  anyOn && visible[k]);
    el.classList.toggle('inactive',anyOn && !visible[k]);
  });
}

function updateAngleButtons(deg) {
  document.querySelectorAll('.a-btn').forEach(b=>
    b.classList.toggle('active', parseInt(b.dataset.angle)===Math.round(deg))
  );
}

function updateZoomLabel() {
  document.getElementById('zoom-label').textContent=`zoom ${zoomScale.toFixed(2)}×`;
}

function update(deg) {
  currentDeg=deg;
  document.getElementById('disp-deg').textContent=deg+'°';
  document.getElementById('disp-rad').textContent=toRad(deg);
  document.getElementById('arc-slider').value=deg;
  document.getElementById('slider-deg').textContent=deg+'°';
  updateAngleButtons(deg);
  updateCards(deg);
  updateLegend();
  draw(deg);
}

function applyZoom(delta) {
  zoomScale=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,zoomScale+delta));
  updateZoomLabel();
  draw(currentDeg);
}

// ─── TOUCH: angle dragging on canvas ─────────────────────────────────────────
function canvasAngleFromTouch(e) {
  const rect=canvas.getBoundingClientRect();
  const t=e.touches[0];
  const dpr=devicePixelRatio;
  const mx=(t.clientX-rect.left)*dpr;
  const my=(t.clientY-rect.top)*dpr;
  const cx=canvas.width/2, cy=canvas.height/2;
  let angle=Math.atan2(cy-my,mx-cx)*180/Math.PI;
  if(angle<0) angle+=360;
  return Math.round(angle);
}

// Pinch zoom state
let pinchDist0=null, zoom0=null;

canvas.addEventListener('touchstart', e=>{
  if (e.touches.length===2) {
    pinchDist0=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    zoom0=zoomScale;
    e.preventDefault();
  } else if (e.touches.length===1) {
    update(canvasAngleFromTouch(e));
  }
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length===2 && pinchDist0!==null){
    const d=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    zoomScale=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX, zoom0*(d/pinchDist0)));
    updateZoomLabel();
    draw(currentDeg);
  } else if(e.touches.length===1){
    update(canvasAngleFromTouch(e));
  }
},{passive:false});

canvas.addEventListener('touchend',e=>{
  if(e.touches.length<2) { pinchDist0=null; zoom0=null; }
},{passive:true});

// Mouse click on canvas (desktop fallback)
canvas.addEventListener('click', e=>{
  const rect=canvas.getBoundingClientRect();
  const dpr=devicePixelRatio;
  const mx=(e.clientX-rect.left)*dpr, my=(e.clientY-rect.top)*dpr;
  const cx=canvas.width/2, cy=canvas.height/2;
  let angle=Math.atan2(cy-my,mx-cx)*180/Math.PI;
  if(angle<0) angle+=360;
  update(Math.round(angle));
});

// Mouse wheel zoom (desktop)
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  applyZoom(e.deltaY<0?+ZOOM_STEP:-ZOOM_STEP);
},{passive:false});

// Zoom buttons
document.getElementById('zoom-in').addEventListener('click',()=>applyZoom(+ZOOM_STEP));
document.getElementById('zoom-out').addEventListener('click',()=>applyZoom(-ZOOM_STEP));

// Slider
document.getElementById('arc-slider').addEventListener('input',e=>update(parseInt(e.target.value)));

// Angle buttons
document.querySelectorAll('.a-btn').forEach(btn=>
  btn.addEventListener('click',()=>update(parseInt(btn.dataset.angle)))
);

// Legend
document.querySelectorAll('.legend-item').forEach(el=>{
  el.addEventListener('click',()=>{
    visible[el.dataset.ratio]=!visible[el.dataset.ratio];
    update(currentDeg);
  });
});

// Clear/show all
document.getElementById('clear-btn').addEventListener('click',()=>{
  const anyOn=Object.values(visible).some(v=>v);
  Object.keys(visible).forEach(k=>visible[k]=!anyOn);
  document.getElementById('clear-btn').textContent=anyOn?'mostrar todas':'apagar todas';
  update(currentDeg);
});

// Resize
window.addEventListener('resize',resizeCanvas);

// Init
resizeCanvas();
update(45);
</script>
</body>
